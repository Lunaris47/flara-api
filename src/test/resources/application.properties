# ===============================
# TEST CONFIGURATION
# ===============================
# Shadows src/main/resources/application.properties during tests so the
# suite runs against an in-memory database with no credentials required.

spring.application.name=flara-api

# ===============================
# DATABASE (H2, in memory)
# ===============================
spring.datasource.url=jdbc:h2:mem:flaratest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===============================
# JWT (throwaway key, test only)
# ===============================
jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
jwt.expiration=86400000

# ===============================
# CORS
# ===============================
cors.allowed-origins=http://localhost:5173